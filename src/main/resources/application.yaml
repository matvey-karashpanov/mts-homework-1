server:
  port: 8081

app:
  name: "Todo MVP"
  version: "2.0.0"
  api-version: "2.0.0"

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    root: DEBUG
    com.mipt.ailanakaramchakova: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
